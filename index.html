<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tela de login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #569fbe;          
    --card-bg: #97bbc2;          
    --border: #D2E3EC;           
    --border-strong: #94C1D2;    
    --accent: #2B7A9B;           
    --logo-yellow: #F1C40F;      
    --text-primary: #1C2B2E;     
    --text-muted: #7A8B94;
    --text-secondary: #43525A;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page-bg);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;      /* Permite alinhar a logo gigante acima do card */
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    user-select: none; 
  }

  /* --- A NOVA LOGO DA CLÍNICA REESTILIZADA --- */
  .annotation {
    font-family: 'Montserrat', sans-serif;
    font-size: 28px;             /* Deixou de ser textinho e virou Título de impacto */
    font-weight: 800;            /* Peso ultra-bold para dar autoridade */
    color: #FFFFFF;              /* Branco puro para brilhar no fundo azul */
    letter-spacing: 0.12em;      /* Letras bem espaçadas (visual sênior e premium) */
    text-transform: uppercase;
    margin: 0 0 16px 0;          /* Espaço perfeito entre ela e o card */
    text-shadow: 0 2px 10px rgba(28, 43, 46, 0.15); /* Sombra cirúrgica para dar profundidade */
    text-align: center;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2.5rem 2rem;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 10px 25px rgba(28, 43, 46, 0.15); /* Sombra mais realista no card */
  }

  .logo-box {
    width: 56px;
    height: 56px;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;         
    color: var(--logo-yellow);       
    background: #FFFDF3;             
  }

  .logo-box svg { 
    width: 26px; 
    height: 26px; 
    filter: drop-shadow(0 2px 4px rgba(241, 196, 15, 0.2)); 
  }

  label {
    font-size: 13px;             
    font-weight: 700;            
    color: var(--text-primary);  
    display: block;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .field {
    width: 100%;
    height: 38px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    margin-bottom: 16px;
    background: #FCFDFD;
    padding: 0 12px;             
    font-family: inherit;
    font-size: 14px;
    color: var(--text-primary);
    outline: none;               
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field.senha { margin-bottom: 12px; }

  .field:focus {
    border-color: var(--accent);
    background: #FFFFFF;         
    box-shadow: 0 0 0 3px rgba(43, 122, 155, 0.15); 
  }

  .row-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;            
  }

  .remember input {
    position: absolute;
    opacity: 0;
    cursor: pointer;
    height: 0;
    width: 0;
  }

  .checkbox-box {
    width: 16px;
    height: 16px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: #FCFDFD;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .remember input:checked ~ .checkbox-box {
    background: var(--accent);
    border-color: var(--accent);
  }

  .checkbox-box::after {
    content: "";
    display: none;
    width: 4px;
    height: 8px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
    margin-bottom: 2px;
  }

  .remember input:checked ~ .checkbox-box::after {
    display: block;
  }

  .muted-text {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-primary); 
  }

  .btn-box {
    height: 40px;
    background: var(--accent);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease; 
  }

  .btn-box:hover {
    background: #1F5C77;
  }

  .btn-box:active {
    transform: scale(0.96); 
    background: #17475C;    
  }

  .btn-label {
    font-size: 12px;
    color: #FFFFFF;              
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<h1 class="annotation">SOLUTIONS</h1>

<div class="card">
  <div class="logo-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"></path>
      <line x1="9" y1="18" x2="15" y2="18"></line>
      <line x1="10" y1="22" x2="14" y2="22"></line>
    </svg>
  </div>

  <label for="loginInput">Login</label>
  <input type="text" id="loginInput" class="field">

  <label for="senhaInput">senha</label>
  <input type="password" id="senhaInput" class="field senha">

  <div class="row-options">
    <label class="remember">
      <input type="checkbox" id="rememberMe">
      <div class="checkbox-box"></div>
      <span class="muted-text">lembrar de mim</span>
    </label>
  </div>

  <div class="btn-box">
    <span class="btn-label">entrar</span>
  </div>
</div>
</body>
</html>
